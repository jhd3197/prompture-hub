name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this covers the
      # TypeScript typecheck and the production bundle in one shot.
      - name: Typecheck + build SPA
        working-directory: frontend
        run: npm run build

      - name: Upload built SPA
        uses: actions/upload-artifact@v4
        with:
          name: spa-${{ github.sha }}
          path: src/prompture_hub/static/app/
          if-no-files-found: error

  # Prompture variants under test:
  #   floor  - exactly the minimum in pyproject.toml (blocking): proves the declared
  #            lower bound is real.
  #   latest - newest release on PyPI (blocking): catches upstream releases that
  #            break us. May equal the floor until a newer release ships.
  #   dev    - Prompture's git dev branch (advisory, see prompture-dev below).
  # Full cross product: the suite is fast, so every Python runs both variants.
  backend:
    name: Python tests (${{ matrix.python-version }}, prompture ${{ matrix.prompture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        prompture: [floor, latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin Prompture to the declared floor
        if: matrix.prompture == 'floor'
        run: |
          FLOOR=$(grep -oP '"prompture>=\K[0-9][0-9.]*' pyproject.toml)
          [ -n "$FLOOR" ] || { echo "::error::could not parse the prompture floor from pyproject.toml"; exit 1; }
          echo "Declared floor: $FLOOR"
          pip install "prompture==$FLOOR"
          echo "PROMPTURE_FLOOR=$FLOOR" >> "$GITHUB_ENV"

      - name: Upgrade Prompture to the latest release
        if: matrix.prompture == 'latest'
        run: pip install --upgrade prompture

      - name: Show installed Prompture
        run: |
          pip show prompture
          python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version
          v = Version(version("prompture"))
          floor = os.environ.get("PROMPTURE_FLOOR")
          if floor:
              assert v == Version(floor), f"expected floor {floor}, got {v}"
          print(f"prompture {v} ({'floor' if floor else 'latest resolved'})")
          PY

      # Once per run, on the newest-deps leg; blocking.
      - name: Lint with ruff
        if: matrix.python-version == '3.12' && matrix.prompture == 'latest'
        run: ruff check .

      # The app boots without the SPA bundle (the /static mount is skipped when
      # the directory is absent and /app degrades to a 503), so tests run on a
      # source checkout with no npm build step.
      - name: Run tests
        run: pytest -q

  # Catches breakage from upcoming Prompture changes before they're released:
  # the hub is built on prompture.gateway / prompture.resilience, so run the
  # suite against Prompture's dev branch too. Non-blocking.
  prompture-dev:
    name: Python tests vs Prompture dev
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project against Prompture dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade "prompture @ git+https://github.com/jhd3197/prompture.git@dev"

      - name: Run tests
        run: pytest -q
