name: Release to PyPI

# Prompture-style flow: develop on `dev`, PR into `main`. Every push to `main`
# auto-bumps the patch version, syncs it into the repo, builds the SPA + wheel
# (so the published package needs no Node), publishes to PyPI via Trusted
# Publishing (OIDC — no stored token), and cuts a GitHub Release.
#
# One-time PyPI setup: a Trusted Publisher for project "prompture-hub" ->
# owner jhd3197, repo prompture-hub, workflow "release.yml", environment "pypi".

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute + tag next version
    runs-on: ubuntu-latest
    # Don't react to the bot's own [skip ci] version-bump commit.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write   # create + push the tag
    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version + create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v

  release:
    name: Build + publish to PyPI
    needs: version
    if: ${{ needs.version.outputs.new_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version-bump commit + create the release
      id-token: write   # OIDC for Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/prompture-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version into pyproject + README + VERSION
        run: python .github/scripts/sync_version.py "${{ needs.version.outputs.new_version }}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify SPA + migrations bundled in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = [
              "prompture_hub/static/app/index.html",
              "prompture_hub/migrations/env.py",
              "prompture_hub/migrations/versions/0001_initial_schema.py",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit("::error::wheel missing: " + ", ".join(missing))
          print("wheel OK: SPA + migrations bundled")
          PY

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

      # After a successful publish, persist the bumped version back to main so
      # the repo always shows the latest released version. [skip ci] keeps this
      # from re-triggering the workflow.
      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml README.md VERSION
          if git diff --cached --quiet; then
            echo "No version files changed."
          else
            git commit -m "🔖 v${{ needs.version.outputs.new_version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
