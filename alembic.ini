# Alembic config for the DEV workflow only (`alembic revision --autogenerate`,
# `alembic upgrade head` from the repo). At runtime the app does NOT use this
# file — init_db() assembles the config in code and points it at the migrations
# bundled inside the package. The migration env lives under the package so it
# ships in the wheel; this file just lets the alembic CLI find it from the repo.
# The actual sqlalchemy.url is set in migrations/env.py from HubSettings.db_path.

[alembic]
script_location = src/prompture_hub/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
