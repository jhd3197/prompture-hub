[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompture-hub"
version = "0.0.1"
description = "Self-hosted gateway over Prompture's multi-provider LLM driver registry. Hub-issued scoped keys map to real provider keys server-side."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan Denis"}]
keywords = ["llm", "openai", "anthropic", "gateway", "openrouter", "prompture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "prompture",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
prompture-hub = "prompture_hub.main:cli"

[project.urls]
Homepage = "https://github.com/jhd3197/prompture-hub"
Issues = "https://github.com/jhd3197/prompture-hub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompture_hub"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
