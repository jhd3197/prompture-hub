[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompture-hub"
version = "0.0.1"
description = "Self-hosted gateway over Prompture's multi-provider LLM driver registry. Hub-issued scoped keys map to real provider keys server-side."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan Denis"}]
keywords = ["llm", "openai", "anthropic", "gateway", "openrouter", "prompture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "prompture",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
prompture-hub = "prompture_hub.main:cli"

[project.urls]
Homepage = "https://github.com/jhd3197/prompture-hub"
Issues = "https://github.com/jhd3197/prompture-hub/issues"

# Custom build hook: compiles the Vite/React SPA (frontend/) into
# src/prompture_hub/static/app/ during sdist + wheel builds. See hatch_build.py.
# Runs for every build target; skips gracefully if Node is absent but a
# prebuilt bundle already exists (devs doing `pip install -e .`, prebuilt CI).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prompture_hub"]
# The built Vite/React SPA lands in src/prompture_hub/static/app/, which is
# .gitignored. Hatchling excludes VCS-ignored paths by default, so force the
# built bundle in explicitly; the key is the on-disk source, the value is the
# path inside the wheel. The build hook (above) produces it before packaging.
# NOTE: only force-include app/ — static/.gitkeep is VCS-tracked and already
# shipped via `packages`, so force-including the whole static/ dir would
# duplicate it (zipfile "Duplicate name" warning).
force-include = { "src/prompture_hub/static/app" = "prompture_hub/static/app" }

[tool.hatch.build.targets.sdist]
# Ship the built SPA in the sdist too so `pip install <sdist>` works without
# Node. force-include uses on-disk-path = path-in-archive.
force-include = { "src/prompture_hub/static/app" = "prompture_hub/static/app" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
